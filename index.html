<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda de Ropa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#EDF2E2;
    --bg-2:#E2E9D3;
    --cream:#FBF9F2;
    --coral:#E15A38;
    --coral-dark:#C2492C;
    --ink:#2B2B24;
    --muted:#767565;
    --line: rgba(43,43,36,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.4), transparent 40%),
      linear-gradient(160deg, var(--bg), var(--bg-2));
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3, .display{
    font-family:'Fraunces',serif;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    padding:22px 24px 18px;
    max-width:1200px;
    margin:0 auto;
  }
  #headerLogo{
    height:70px;
    width:auto;
    border-radius:8px;
    display:block;
    object-fit:cover;
  }
  .store-name{
    font-size:26px;
    margin:0 auto 0 0;
    flex:1;
    min-width:140px;
  }
  .pill-btn{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:17px;
    padding:12px 24px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    background: linear-gradient(180deg, #EE6C48, var(--coral));
    color:#fff;
    box-shadow: 0 4px 0 var(--coral-dark), 0 8px 16px rgba(194,73,44,0.25);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .pill-btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--coral-dark);}
  .pill-btn.ghost{
    background:var(--cream);
    color:var(--ink);
    box-shadow: 0 4px 0 var(--line), 0 8px 16px rgba(0,0,0,0.06);
    font-size:15px;
    padding:10px 20px;
  }
  .pill-btn.active{
    background: linear-gradient(180deg, var(--ink), #111);
    box-shadow: 0 4px 0 #000;
  }
  nav.cats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .seam{
    max-width:1200px;
    margin:6px auto 26px;
    border:none;
    border-top:2px dashed var(--line);
  }
  main{
    max-width:1200px;
    margin:0 auto;
    padding:0 24px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap:26px;
  }
  .seccion-inicio{ margin-bottom:44px; }
  .seccion-inicio .seccion-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px;
  }
  .seccion-inicio h2{ font-size:24px; margin:0; }
  .card{
    background:var(--cream);
    border-radius:6px;
    padding:14px 14px 16px;
    box-shadow: 0 10px 22px rgba(43,43,36,0.12);
    cursor:pointer;
    position:relative;
    transition: transform .18s ease;
  }
  .card:hover{ transform: rotate(-1deg) translateY(-3px); }
  .card:nth-child(even):hover{ transform: rotate(1deg) translateY(-3px); }
  .card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:2px;
    display:block;
    background: linear-gradient(180deg, #cfe4f2, #cfe0c1);
  }
  .card .nombre{
    margin-top:12px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
  }
  .tag{
    position:absolute;
    top:-10px;
    right:10px;
    background:var(--coral);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:5px 10px;
    border-radius:3px;
    box-shadow:0 3px 6px rgba(0,0,0,0.2);
    transform:rotate(4deg);
  }
  .tag::after{
    content:'';
    position:absolute;
    top:-4px; left:8px;
    width:6px;height:6px;
    background:var(--bg);
    border-radius:50%;
    border:1px solid rgba(0,0,0,0.2);
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:16px;
  }

  /* carrito flotante */
  #cartFloat{
    position:fixed;
    bottom:22px; right:22px;
    width:60px; height:60px;
    border-radius:50%;
    background: linear-gradient(180deg, #EE6C48, var(--coral));
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    border:none;
    font-size:26px;
    cursor:pointer;
    z-index:40;
    display:flex; align-items:center; justify-content:center;
  }
  #cartBadge{
    position:absolute; top:-4px; right:-4px;
    background:var(--ink); color:#fff;
    font-size:12px; font-weight:700;
    min-width:20px; height:20px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }

  /* modales */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,20,15,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--cream);
    border-radius:14px;
    max-width:640px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    padding:26px;
    position:relative;
  }
  .modal.small{ max-width:340px; text-align:center; }
  .close-x{
    position:absolute; top:14px; right:16px;
    background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);
  }
  .gallery-main{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
    background:#dde5ce;
  }
  .thumbs{
    display:flex;
    gap:8px;
    margin-top:10px;
    overflow-x:auto;
  }
  .thumbs img{
    width:56px;height:56px;object-fit:cover;border-radius:6px;
    cursor:pointer;border:2px solid transparent;
    opacity:.7;
  }
  .thumbs img.active{ border-color:var(--coral); opacity:1; }
  .swatches{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center; }
  .swatch{
    width:30px; height:30px; border-radius:50%;
    border:2px solid rgba(0,0,0,0.15);
    cursor:pointer;
    padding:0;
  }
  .swatch.active{ border-color:var(--ink); box-shadow:0 0 0 2px var(--cream), 0 0 0 4px var(--ink); }
  .color-nombre-actual{ font-size:14px; color:var(--muted); margin-top:6px; }
  .detalle-precio{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:700;
    color:var(--coral-dark);
    margin:14px 0 4px;
  }
  .detalle-desc{ color:var(--muted); line-height:1.5; margin-bottom:18px;}
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn-comprar{ flex:1; text-align:center; min-width:130px; }
  .icon-btn{
    background:none;border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;cursor:pointer;
    font-size:14px; color:var(--muted);
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--ink); }

  label{ display:block; font-size:13px; font-weight:600; margin:14px 0 5px; color:var(--muted); }
  input[type=text], input[type=number], input[type=password], textarea, select{
    width:100%; padding:10px 12px; border-radius:8px;
    border:1px solid var(--line); font-family:inherit; font-size:15px;
    background:#fff;
  }
  textarea{ min-height:70px; resize:vertical; }
  .pin-input{
    font-size:26px; text-align:center; letter-spacing:8px;
    width:100%; padding:14px; border-radius:10px; border:1px solid var(--line);
    margin:18px 0;
  }
  .foto-mini{ position:relative; display:inline-block; margin:4px; }
  .foto-mini img{ width:70px;height:70px;object-fit:cover;border-radius:6px; }
  .foto-mini button{
    position:absolute; top:-6px; right:-6px;
    background:var(--coral); color:#fff; border:none;
    border-radius:50%; width:20px;height:20px; font-size:12px; cursor:pointer;
    line-height:1;
  }
  .color-block{
    border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; background:#fff;
  }
  .color-block .row{ margin-bottom:6px; }
  .prod-admin-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .prod-admin-row img{ width:44px;height:44px;object-fit:cover;border-radius:6px; }
  .prod-admin-row .info{ flex:1; }
  .prod-admin-row .info b{ font-family:'Fraunces',serif; }
  .msg{ font-size:13px; margin-top:8px; min-height:16px; }
  .msg.err{ color:#B23A2E; }
  .msg.ok{ color:#3E7A3B; }
  .carrito-item{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .carrito-item img{ width:50px;height:50px;object-fit:cover;border-radius:6px; }
  .carrito-item .info{ flex:1; }
  .carrito-total{ font-family:'Fraunces',serif; font-size:22px; text-align:right; margin:16px 0; }
  footer{ text-align:center; color:var(--muted); font-size:13px; margin-top:60px;}

  /* ==== Panel admin: todo mas grande y legible ==== */
  .modal.admin-modal{ font-size:19px; }
  .modal.admin-modal h3{ font-size:26px; }
  .modal.admin-modal label{ font-size:16px; margin:18px 0 7px; }
  .modal.admin-modal input[type=text],
  .modal.admin-modal input[type=number],
  .modal.admin-modal input[type=password],
  .modal.admin-modal textarea,
  .modal.admin-modal select{ font-size:18px; padding:14px 14px; }
  .modal.admin-modal .pill-btn{ font-size:19px; padding:15px 26px; }
  .modal.admin-modal .icon-btn{ font-size:16px; padding:12px 16px; }
  .modal.admin-modal .swatch{ width:38px; height:38px; }
  .modal.admin-modal .prod-admin-row{ font-size:17px; padding:14px 0; }
  .modal.admin-modal .prod-admin-row img{ width:56px; height:56px; }
  .modal.admin-modal .msg{ font-size:16px; }
  .gear-btn{
    background:var(--cream); border:1px solid var(--line); border-radius:8px;
    font-size:20px; padding:6px 12px; cursor:pointer;
  }
  .color-preview-actual{
    width:34px; height:34px; border-radius:50%; border:2px solid rgba(0,0,0,0.15);
    display:inline-block; vertical-align:middle;
  }
  .paleta-toggle-row{ display:flex; align-items:center; gap:12px; }
  .rango-row{ display:flex; align-items:center; gap:14px; }
  .rango-row input[type=range]{ flex:1; }
  .rango-row span{ font-weight:700; min-width:46px; text-align:right; }
</style>
</head>
<body>

<header>
  <img id="headerLogo" src="" alt="Logo">
  <h1 class="store-name display" id="storeName">Tienda de Ropa</h1>
  <nav class="cats">
    <button class="pill-btn active" data-cat="inicio">Inicio</button>
    <button class="pill-btn" data-cat="chicos">Chicos</button>
    <button class="pill-btn" data-cat="mujer">Mujer</button>
    <button class="pill-btn" data-cat="hombre">Hombre</button>
  </nav>
  <button class="pill-btn ghost" id="btnPanel">Panel</button>
</header>
<hr class="seam">

<main>
  <div id="contenido"></div>
</main>

<footer>Hecho con APLI COP</footer>

<!-- Carrito flotante -->
<button id="cartFloat" title="Ver carrito">🛒<span id="cartBadge">0</span></button>

<!-- Modal detalle producto -->
<div class="overlay" id="overlayDetalle">
  <div class="modal">
    <button class="close-x" data-close="overlayDetalle">&times;</button>
    <img class="gallery-main" id="galleryMain" src="">
    <div class="thumbs" id="thumbs"></div>
    <div class="swatches" id="swatches"></div>
    <div class="color-nombre-actual" id="colorNombreActual"></div>
    <h2 class="display" id="detalleNombre" style="margin:16px 0 0;"></h2>
    <div class="detalle-precio" id="detallePrecio"></div>
    <div class="detalle-desc" id="detalleDesc"></div>
    <div class="row">
      <button class="pill-btn btn-comprar" id="btnComprar">Comprar</button>
      <button class="pill-btn ghost" id="btnAgregarCarrito">+ Carrito</button>
      <button class="icon-btn" id="btnEditarProducto" title="Editar producto">✏️ Editar</button>
    </div>
    <div class="msg ok" id="carritoAddMsg"></div>
  </div>
</div>

<!-- Modal carrito -->
<div class="overlay" id="overlayCarrito">
  <div class="modal">
    <button class="close-x" data-close="overlayCarrito">&times;</button>
    <h3 class="display">Tu carrito</h3>
    <div id="listaCarrito"></div>
    <div class="carrito-total" id="carritoTotal"></div>
    <button class="pill-btn" id="btnComprarTodo" style="width:100%;">Comprar todo por WhatsApp</button>
  </div>
</div>

<!-- Modal PIN -->
<div class="overlay" id="overlayPin">
  <div class="modal small admin-modal">
    <button class="close-x" data-close="overlayPin">&times;</button>
    <h3 class="display">Ingresá el PIN</h3>
    <input type="text" inputmode="numeric" maxlength="6" class="pin-input" id="pinInput" placeholder="••••">
    <button class="pill-btn" id="btnPinOk" style="width:100%;">Entrar</button>
    <div class="msg err" id="pinMsg"></div>
  </div>
</div>

<!-- Modal editar producto -->
<div class="overlay" id="overlayEditar">
  <div class="modal admin-modal">
    <button class="close-x" data-close="overlayEditar">&times;</button>
    <h3 class="display" id="editarTitulo">Editar producto</h3>

    <label>Nombre</label>
    <input type="text" id="fNombre">

    <label>Descripción</label>
    <textarea id="fDescripcion"></textarea>

    <label>Precio</label>
    <input type="number" id="fPrecio" min="0" step="1">

    <label>Categoría</label>
    <select id="fCategoria">
      <option value="chicos">Chicos</option>
      <option value="mujer">Mujer</option>
      <option value="hombre">Hombre</option>
    </select>

    <label>Fotos generales (se usan si no cargás colores)</label>
    <div id="fFotos"></div>
    <input type="file" id="fFotoInput" accept="image/*" multiple style="margin-top:8px;">

    <label>Colores (opcional — cada color puede tener sus propias fotos)</label>
    <div id="fColores"></div>
    <button type="button" class="pill-btn ghost" id="btnAgregarColor">+ Agregar color</button>

    <div class="row" style="margin-top:24px;">
      <button class="pill-btn" id="btnGuardarProducto" style="flex:1;">Guardar</button>
      <button class="icon-btn" id="btnBorrarProducto">Borrar producto</button>
    </div>
    <div class="msg" id="editarMsg"></div>
  </div>
</div>

<!-- Modal panel general -->
<div class="overlay" id="overlayPanel">
  <div class="modal admin-modal">
    <button class="close-x" data-close="overlayPanel">&times;</button>
    <h3 class="display">Panel de la tienda</h3>

    <div class="row" style="justify-content:space-between; align-items:center; margin-top:10px;">
      <h3 class="display" style="margin:0;">Productos</h3>
      <button class="pill-btn ghost" id="btnNuevoProducto">+ Nuevo producto</button>
    </div>
    <div id="listaProductosAdmin" style="margin-top:14px;"></div>

    <hr class="seam" style="margin:28px 0;">

    <button type="button" class="pill-btn ghost" id="btnToggleAjustes" style="width:100%;">⚙ Ajustes de la tienda</button>

    <div id="bloqueAjustes" style="display:none; margin-top:20px;">
      <label>Nombre de la tienda</label>
      <input type="text" id="cNombreTienda">

      <label>Logo</label>
      <input type="text" id="cLogoUrl" placeholder="https://... (dejalo vacío para usar el logo por defecto)">
      <button type="button" class="pill-btn ghost" id="btnSubirLogo" style="margin-top:10px;">📷 Subir foto del logo desde el celular</button>
      <input type="file" id="cLogoFotoInput" accept="image/*" style="display:none;">
      <div class="msg" id="logoUploadMsg"></div>
      <div class="rango-row" style="margin-top:12px;">
        <span style="min-width:120px; text-align:left; font-weight:600;">Tamaño del logo</span>
        <input type="range" id="cLogoSize" min="30" max="160" value="70">
        <span id="cLogoSizeValor">70px</span>
      </div>

      <label>Color principal <button type="button" class="gear-btn" id="btnGear" title="Elegir color">⚙</button></label>
      <div class="paleta-toggle-row">
        <span class="color-preview-actual" id="colorPreviewActual"></span>
        <span id="colorPreviewNombre" style="color:var(--muted);"></span>
      </div>
      <div class="swatches" id="paletaPrincipal" style="display:none; margin-top:12px;"></div>

      <button class="pill-btn" id="btnGuardarConfig" style="width:100%; margin-top:20px;">Guardar ajustes</button>
      <div class="msg" id="configMsg"></div>

      <hr class="seam" style="margin:26px 0;">

      <h3 class="display" style="margin:0 0 12px;">Seguridad</h3>

      <label>Cambiar PIN del Panel</label>
      <div class="row">
        <input type="text" inputmode="numeric" id="pinPanelActual" placeholder="PIN actual" style="flex:1;">
        <input type="text" inputmode="numeric" id="pinPanelNuevo" placeholder="PIN nuevo" style="flex:1;">
      </div>
      <button class="pill-btn ghost" id="btnCambiarPinPanel" style="margin-top:10px;">Cambiar PIN del Panel</button>
      <div class="msg" id="pinPanelMsg"></div>
    </div>
  </div>
</div>

<!-- Modal ajustar/recortar foto -->
<div class="overlay" id="overlayCrop">
  <div class="modal admin-modal" style="max-width:380px; text-align:center;">
    <button class="close-x" id="cropCancelX">&times;</button>
    <h3 class="display">Ajustá la foto</h3>
    <div class="msg" id="cropContador" style="margin-bottom:8px;"></div>
    <canvas id="cropCanvas" width="300" height="300" style="border-radius:10px; border:2px solid var(--line); touch-action:none; cursor:grab; max-width:100%; background:#e4e4e4;"></canvas>
    <div class="row" style="justify-content:center; margin-top:14px;">
      <button type="button" class="icon-btn" id="cropRotarIzq">↺ Rotar</button>
      <button type="button" class="icon-btn" id="cropRotarDer">↻ Rotar</button>
    </div>
    <div class="rango-row" style="margin-top:14px;">
      <span>Zoom</span>
      <input type="range" id="cropZoomInput" min="1" max="3" step="0.05" value="1">
    </div>
    <p style="color:var(--muted); font-size:0.85em; margin-top:10px;">Arrastrá la foto con el dedo o el mouse para ubicarla dentro del cuadro.</p>
    <div class="row" style="margin-top:18px;">
      <button class="pill-btn ghost" id="cropCancelar" style="flex:1;">Cancelar</button>
      <button class="pill-btn" id="cropConfirmar" style="flex:1;">Usar esta foto</button>
    </div>
  </div>
</div>

<script>
/* ============================================
   CONFIGURACIÓN SUPABASE

// ---------- Recortador de fotos (rotar + zoom + arrastrar) ----------
let cropImg = null;
let cropRotation = 0;
let cropZoom = 1;
let cropOffsetX = 0;
let cropOffsetY = 0;
let cropResolve = null;
let cropDragging = false;
let cropStartX = 0, cropStartY = 0, cropStartOffsetX = 0, cropStartOffsetY = 0;
const CROP_VIEWPORT = 300;
const CROP_OUTPUT = 900;

function cropCoverScale(imgW, imgH, rotation, viewport){
  const efW = (rotation===90 || rotation===270) ? imgH : imgW;
  const efH = (rotation===90 || rotation===270) ? imgW : imgH;
  return Math.max(viewport/efW, viewport/efH);
}

function dibujarCrop(){
  const canvas = $("cropCanvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,CROP_VIEWPORT,CROP_VIEWPORT);
  ctx.save();
  ctx.translate(CROP_VIEWPORT/2 + cropOffsetX, CROP_VIEWPORT/2 + cropOffsetY);
  ctx.rotate(cropRotation * Math.PI/180);
  const cs = cropCoverScale(cropImg.width, cropImg.height, cropRotation, CROP_VIEWPORT) * cropZoom;
  ctx.scale(cs, cs);
  ctx.drawImage(cropImg, -cropImg.width/2, -cropImg.height/2);
  ctx.restore();
}

function abrirRecortador(file, num, total){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      cropImg = img;
      cropRotation = 0;
      cropZoom = 1;
      cropOffsetX = 0;
      cropOffsetY = 0;
      cropResolve = (blob)=>{ URL.revokeObjectURL(url); resolve(blob); };
      $("cropContador").textContent = (num && total && total>1) ? `Foto ${num} de ${total}` : "";
      $("cropZoomInput").value = 1;
      dibujarCrop();
      open("overlayCrop");
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

function cancelarCrop(){
  if (cropResolve){
    const r = cropResolve;
    cropResolve = null;
    close("overlayCrop");
    r(null);
  }
}

$("cropCancelar").addEventListener("click", cancelarCrop);
$("cropCancelX").addEventListener("click", cancelarCrop);

$("cropRotarIzq").addEventListener("click", ()=>{
  cropRotation = (cropRotation - 90 + 360) % 360;
  cropZoom = 1; cropOffsetX = 0; cropOffsetY = 0;
  $("cropZoomInput").value = 1;
  dibujarCrop();
});
$("cropRotarDer").addEventListener("click", ()=>{
  cropRotation = (cropRotation + 90) % 360;
  cropZoom = 1; cropOffsetX = 0; cropOffsetY = 0;
  $("cropZoomInput").value = 1;
  dibujarCrop();
});
$("cropZoomInput").addEventListener("input", ()=>{
  cropZoom = Number($("cropZoomInput").value);
  dibujarCrop();
});

(function(){
  const canvas = $("cropCanvas");
  canvas.addEventListener("pointerdown", e=>{
    cropDragging = true;
    cropStartX = e.clientX; cropStartY = e.clientY;
    cropStartOffsetX = cropOffsetX; cropStartOffsetY = cropOffsetY;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = "grabbing";
  });
  canvas.addEventListener("pointermove", e=>{
    if (!cropDragging) return;
    cropOffsetX = cropStartOffsetX + (e.clientX - cropStartX);
    cropOffsetY = cropStartOffsetY + (e.clientY - cropStartY);
    dibujarCrop();
  });
  canvas.addEventListener("pointerup", ()=>{ cropDragging = false; canvas.style.cursor = "grab"; });
  canvas.addEventListener("pointercancel", ()=>{ cropDragging = false; canvas.style.cursor = "grab"; });
})();

$("cropConfirmar").addEventListener("click", ()=>{
  const factor = CROP_OUTPUT / CROP_VIEWPORT;
  const out = document.createElement("canvas");
  out.width = CROP_OUTPUT; out.height = CROP_OUTPUT;
  const ctx = out.getContext("2d");
  ctx.save();
  ctx.translate(CROP_OUTPUT/2 + cropOffsetX*factor, CROP_OUTPUT/2 + cropOffsetY*factor);
  ctx.rotate(cropRotation * Math.PI/180);
  const cs = cropCoverScale(cropImg.width, cropImg.height, cropRotation, CROP_VIEWPORT) * cropZoom * factor;
  ctx.scale(cs, cs);
  ctx.drawImage(cropImg, -cropImg.width/2, -cropImg.height/2);
  ctx.restore();
  out.toBlob((blob)=>{
    const r = cropResolve;
    cropResolve = null;
    close("overlayCrop");
    if (r) r(blob);
  }, "image/jpeg", 0.9);
});

// ---------- Helpers ----------
function $(id){ return document.getElementById(id); }
function open(id){ $(id).classList.add("show"); }
function close(id){ $(id).classList.remove("show"); }
function money(n){ return "$" + Number(n || 0).toLocaleString("es-AR"); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

// ---------- Carga inicial ----------
async function cargarConfig(){
  const { data, error } = await sb.from("ropa_config").select("*").eq("id",1).maybeSingle();
  if (error){ console.error(error); return; }
  if (data){
    config = {
      nombre_tienda: data.nombre_tienda || "Tienda de Ropa",
      logo_url: data.logo_url || "",
      logo_size: data.logo_size || 70,
      color_principal: data.color_principal || "#E15A38",
      pin_panel: data.pin_panel || "1234",
      pin_producto: data.pin_producto || "1234"
    };
  }
  aplicarConfigVisual();
}

function aplicarConfigVisual(){
  $("storeName").textContent = config.nombre_tienda;
  document.documentElement.style.setProperty("--coral", config.color_principal);
  $("headerLogo").src = config.logo_url || LOGO_DEFAULT;
  $("headerLogo").style.height = config.logo_size + "px";

  $("cNombreTienda").value = config.nombre_tienda;
  $("cLogoUrl").value = config.logo_url;
  $("cLogoSize").value = config.logo_size;
  $("cLogoSizeValor").textContent = config.logo_size + "px";
  colorPrincipalSeleccionado = config.color_principal;
  actualizarPreviewColor();
  renderPaletaPrincipal();
}

$("btnToggleAjustes").addEventListener("click", ()=>{

});

$("cLogoSize").addEventListener("input", ()=>{

});

function actualizarPreviewColor(){
  $("colorPreviewActual").style.background = colorPrincipalSeleccionado;
  const c = PALETA_COLORES.find(c=>c.h.toLowerCase() === colorPrincipalSeleccionado.toLowerCase());
  $("colorPreviewNombre").textContent = c ? c.n : colorPrincipalSeleccionado;
}

$("btnGear").addEventListener("click", ()=>{

  p.style.display = p.style.display === "none" ? "flex" : "none";
});

function renderPaletaPrincipal(){
  $("paletaPrincipal").innerHTML = PALETA_COLORES.map(c=>`
    <button type="button" class="swatch ${c.h.toLowerCase()===colorPrincipalSeleccionado.toLowerCase()?'active':''}"
      style="background:${c.h};" data-hex="${c.h}" title="${c.n}"></button>
  `).join("");
  $("paletaPrincipal").querySelectorAll(".swatch").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      colorPrincipalSeleccionado = sw.dataset.hex;
      document.documentElement.style.setProperty("--coral", colorPrincipalSeleccionado);
      actualizarPreviewColor();
      renderPaletaPrincipal();
    });
  });
}

async function cargarProductos(){
  const { data, error } = await sb.from("ropa_productos").select("*").order("created_at",{ascending:false});
  if (error){ console.error(error); return; }
  productos = data || [];
  renderContenido();
}

// ---------- Render vista pública ----------
function renderContenido(){
  const cont = $("contenido");
  if (categoriaActual === "inicio"){
    const cats = [
      {key:"hombre", label:"Hombre"},
      {key:"mujer", label:"Mujer"},
      {key:"chicos", label:"Chicos"}
    ];
    let html = "";
    let algo = false;
    cats.forEach(c=>{
      const items = productos.filter(p=>p.categoria===c.key).slice(0,4);
      if (!items.length) return;
      algo = true;
      html += `
        <div class="seccion-inicio">
          <div class="seccion-head">
            <h2>${c.label}</h2>
            <button class="icon-btn" data-vertodo="${c.key}">Ver todo →</button>
          </div>
          <div class="grid">${items.map(p=>cardHTML(p)).join("")}</div>
        </div>
      `;
    });
    cont.innerHTML = algo ? html : `<div class="empty">Todavía no hay productos cargados.</div>`;
    cont.querySelectorAll("[data-vertodo]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        categoriaActual = btn.dataset.vertodo;
        marcarCategoriaActiva();
        renderContenido();
      });
    });
  } else {
    const items = productos.filter(p=>p.categoria===categoriaActual);
    cont.innerHTML = items.length
      ? `<div class="grid">${items.map(p=>cardHTML(p)).join("")}</div>`
      : `<div class="empty">Todavía no hay productos en esta categoría.</div>`;
  }
  cont.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click", ()=>{
      const p = productos.find(x=>x.id === card.dataset.id);
      if (p) abrirDetalle(p);
    });
  });
}

function primeraFoto(p){
  if (p.colores && p.colores.length && p.colores[0].fotos && p.colores[0].fotos.length) return p.colores[0].fotos[0];
  if (p.fotos && p.fotos.length) return p.fotos[0];
  return "";
}

function cardHTML(p){
  return `
    <div class="card" data-id="${p.id}">
      <div class="tag">${money(p.precio)}</div>
      <img src="${primeraFoto(p)}" alt="${p.nombre}">
      <div class="nombre">${p.nombre}</div>
    </div>
  `;
}

function marcarCategoriaActiva(){
  document.querySelectorAll(".cats .pill-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.cat === categoriaActual);
  });
}

document.querySelectorAll(".cats .pill-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    categoriaActual = btn.dataset.cat;
    marcarCategoriaActiva();
    renderContenido();
  });
});

// ---------- Detalle producto ----------
function fotosDeColor(p, idx){
  if (idx === null || idx === undefined) return p.fotos || [];
  const c = p.colores[idx];
  return (c.fotos && c.fotos.length) ? c.fotos : (p.fotos || []);
}

function abrirDetalle(p){
  productoActual = p;
  colorSeleccionado = (p.colores && p.colores.length) ? 0 : null;
  renderGaleriaDetalle();
  $("detalleNombre").textContent = p.nombre;
  $("detallePrecio").textContent = money(p.precio);
  $("detalleDesc").textContent = p.descripcion || "";
  $("carritoAddMsg").textContent = "";

  if (p.colores && p.colores.length){
    $("swatches").innerHTML = p.colores.map((c,i)=>`
      <button type="button" class="swatch ${i===colorSeleccionado?'active':''}" style="background:${c.hex};" data-i="${i}" title="${c.nombre}"></button>
    `).join("");
    $("swatches").querySelectorAll(".swatch").forEach(sw=>{
      sw.addEventListener("click", ()=>{
        colorSeleccionado = Number(sw.dataset.i);
        renderGaleriaDetalle();
        $("swatches").querySelectorAll(".swatch").forEach(s=>s.classList.remove("active"));
        sw.classList.add("active");
        $("colorNombreActual").textContent = "Color: " + p.colores[colorSeleccionado].nombre;
      });
    });
    $("colorNombreActual").textContent = "Color: " + p.colores[0].nombre;
  } else {
    $("swatches").innerHTML = "";
    $("colorNombreActual").textContent = "";
  }
  open("overlayDetalle");
}

function renderGaleriaDetalle(){
  const fotos = fotosDeColor(productoActual, colorSeleccionado);
  $("galleryMain").src = fotos[0] || "";
  $("thumbs").innerHTML = fotos.map((f,i)=>`<img src="${f}" class="${i===0?'active':''}" data-i="${i}">`).join("");
  $("thumbs").querySelectorAll("img").forEach(img=>{
    img.addEventListener("click", ()=>{
      $("galleryMain").src = fotos[Number(img.dataset.i)];
      $("thumbs").querySelectorAll("img").forEach(t=>t.classList.remove("active"));
      img.classList.add("active");
    });
  });
}

$("btnComprar").addEventListener("click", ()=>{
  if (!productoActual) return;
  const texto = encodeURIComponent(`Te quiero comprar este producto ${productoActual.nombre}`);
  window.location.href = `https://wa.me/${WHATSAPP_NUMERO}?text=${texto}`;
});

$("btnAgregarCarrito").addEventListener("click", ()=>{
  if (!productoActual) return;
  const existente = carrito.find(i=>i.id === productoActual.id);
  if (existente){
    existente.qty += 1;
  } else {
    carrito.push({ id: productoActual.id, nombre: productoActual.nombre, precio: productoActual.precio, qty: 1, foto: primeraFoto(productoActual) });
  }
  actualizarBadgeCarrito();
  $("carritoAddMsg").textContent = "¡Agregado al carrito!";
  setTimeout(()=>{ $("carritoAddMsg").textContent = ""; }, 1800);
});

$("btnEditarProducto").addEventListener("click", ()=>{
  pedirPin(()=>{
    close("overlayDetalle");
    abrirEditor(productoActual);
  });
});

// ---------- Carrito ----------
function actualizarBadgeCarrito(){
  const total = carrito.reduce((s,i)=>s+i.qty,0);
  $("cartBadge").textContent = total;
}

function renderCarrito(){
  const cont = $("listaCarrito");
  if (!carrito.length){
    cont.innerHTML = `<p style="color:var(--muted);">Todavía no agregaste nada.</p>`;
    $("carritoTotal").textContent = "";
    return;
  }
  cont.innerHTML = carrito.map(i=>`
    <div class="carrito-item">
      <img src="${i.foto || ''}">
      <div class="info"><b>${i.nombre}</b><br><span style="color:var(--muted);">${i.qty} x ${money(i.precio)}</span></div>
      <button class="icon-btn" data-quitar="${i.id}">Quitar</button>
    </div>
  `).join("");
  cont.querySelectorAll("[data-quitar]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      carrito = carrito.filter(i=>i.id !== btn.dataset.quitar);
      actualizarBadgeCarrito();
      renderCarrito();
    });
  });
  const total = carrito.reduce((s,i)=>s + i.precio*i.qty, 0);
  $("carritoTotal").textContent = "Total: " + money(total);
}

$("cartFloat").addEventListener("click", ()=>{
  renderCarrito();
  open("overlayCarrito");
});

$("btnComprarTodo").addEventListener("click", ()=>{
  if (!carrito.length) return;
  const listado = carrito.map(i => (i.qty>1 ? i.qty+"x " : "") + i.nombre).join(", ");
  const texto = encodeURIComponent(`Te quiero comprar estos productos ${listado}`);
  window.location.href = `https://wa.me/${WHATSAPP_NUMERO}?text=${texto}`;
});

// ---------- PIN ----------
function pedirPin(callback){
  pinCallback = callback;
  $("pinInput").value = "";
  $("pinMsg").textContent = "";
  open("overlayPin");
  setTimeout(()=> $("pinInput").focus(), 100);
}
$("btnPinOk").addEventListener("click", verificarPin);
$("pinInput").addEventListener("keydown", e=>{ if(e.key==="Enter") verificarPin(); });
function verificarPin(){
  if ($("pinInput").value.trim() === config.pin_panel){
    close("overlayPin");
    const cb = pinCallback;
    pinCallback = null;
    if (cb) cb();
  } else {
    $("pinMsg").textContent = "PIN incorrecto.";
  }
}

$("btnPanel").addEventListener("click", ()=>{
  pedirPin(()=>{
    renderListaProductosAdmin();
    open("overlayPanel");
  });
});

// ---------- Editor de producto ----------
function abrirEditor(producto){
  productoEditando = producto || null;
  fotosEditando = producto ? [...(producto.fotos || [])] : [];
  coloresEditando = producto ? JSON.parse(JSON.stringify(producto.colores || [])) : [];
  $("editarTitulo").textContent = producto ? "Editar producto" : "Nuevo producto";
  $("fNombre").value = producto ? producto.nombre : "";
  $("fDescripcion").value = producto ? (producto.descripcion || "") : "";
  $("fPrecio").value = producto ? producto.precio : "";
  $("fCategoria").value = producto ? producto.categoria : (["chicos","mujer","hombre"].includes(categoriaActual) ? categoriaActual : "chicos");
  $("btnBorrarProducto").style.display = producto ? "inline-block" : "none";
  $("editarMsg").textContent = "";
  renderFotosEditor();
  renderColoresEditor();
  close("overlayPanel");
  open("overlayEditar");
}

function renderFotosEditor(){
  $("fFotos").innerHTML = fotosEditando.map((url,i)=>`
    <span class="foto-mini"><img src="${url}"><button data-i="${i}" title="Quitar">&times;</button></span>
  `).join("");
  $("fFotos").querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      fotosEditando.splice(Number(btn.dataset.i),1);
      renderFotosEditor();
    });
  });
}

$("fFotoInput").addEventListener("change", async (e)=>{
  await subirFotos(e.target.files, fotosEditando, renderFotosEditor);
  e.target.value = "";
});

async function subirFotos(files, arrayDestino, callbackRender){
  const lista = Array.from(files || []);
  if (!lista.length) return;
  for (let i=0; i<lista.length; i++){
    const file = lista[i];
    const blob = await abrirRecortador(file, i+1, lista.length);
    if (!blob) continue; // el usuario canceló esta foto puntual
    $("editarMsg").textContent = "Subiendo foto...";
    $("editarMsg").className = "msg";
    const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
    const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" });
    if (upErr){
      $("editarMsg").textContent = "Error subiendo foto: " + upErr.message;
      $("editarMsg").className = "msg err";
      continue;
    }
    const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
    arrayDestino.push(data.publicUrl);
    callbackRender();
  }
  $("editarMsg").textContent = "";
}

// ---------- Colores del producto (editor) ----------
function renderColoresEditor(){
  $("fColores").innerHTML = coloresEditando.map((c,i)=>`
    <div class="color-block" data-idx="${i}">
      <div class="row">
        <input type="text" class="color-nombre-input" data-idx="${i}" placeholder="Nombre del color (ej: Rojo)" value="${c.nombre || ''}" style="flex:1;">
        <button type="button" class="icon-btn" data-quitarcolor="${i}">Quitar color</button>
      </div>
      <div class="swatches color-paleta" data-idx="${i}">
        ${PALETA_COLORES.map(p=>`<button type="button" class="swatch ${p.h.toLowerCase()===(c.hex||'').toLowerCase()?'active':''}" style="background:${p.h};" data-idx="${i}" data-hex="${p.h}" title="${p.n}"></button>`).join("")}
      </div>
      <label style="margin-top:10px;">Fotos de este color</label>
      <div class="color-fotos" data-idx="${i}">
        ${(c.fotos||[]).map((url,fi)=>`<span class="foto-mini"><img src="${url}"><button data-idx="${i}" data-fi="${fi}">&times;</button></span>`).join("")}
      </div>
      <input type="file" accept="image/*" multiple class="color-foto-input" data-idx="${i}">
    </div>
  `).join("");

  $("fColores").querySelectorAll(".color-nombre-input").forEach(inp=>{
    inp.addEventListener("input", ()=>{ coloresEditando[Number(inp.dataset.idx)].nombre = inp.value; });
  });
  $("fColores").querySelectorAll("[data-quitarcolor]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      coloresEditando.splice(Number(btn.dataset.quitarcolor),1);
      renderColoresEditor();
    });
  });
  $("fColores").querySelectorAll(".color-paleta .swatch").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      coloresEditando[Number(sw.dataset.idx)].hex = sw.dataset.hex;
      renderColoresEditor();
    });
  });
  $("fColores").querySelectorAll(".color-fotos button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.dataset.idx), fi = Number(btn.dataset.fi);
      coloresEditando[idx].fotos.splice(fi,1);
      renderColoresEditor();
    });
  });
  $("fColores").querySelectorAll(".color-foto-input").forEach(inp=>{
    inp.addEventListener("change", async ()=>{
      const idx = Number(inp.dataset.idx);
      if (!coloresEditando[idx].fotos) coloresEditando[idx].fotos = [];
      await subirFotos(inp.files, coloresEditando[idx].fotos, renderColoresEditor);
    });
  });
}

$("btnAgregarColor").addEventListener("click", ()=>{
  coloresEditando.push({ nombre:"", hex: PALETA_COLORES[0].h, fotos: [] });
  renderColoresEditor();
});

$("btnGuardarProducto").addEventListener("click", async ()=>{
  const nombre = $("fNombre").value.trim();
  const precio = Number($("fPrecio").value || 0);
  const categoria = $("fCategoria").value;
  const descripcion = $("fDescripcion").value.trim();
  if (!nombre){
    $("editarMsg").textContent = "Poné un nombre para el producto.";
    $("editarMsg").className = "msg err";
    return;
  }
  const coloresLimpios = coloresEditando
    .filter(c=>c.nombre && c.nombre.trim())
    .map(c=>({ nombre: c.nombre.trim(), hex: c.hex, fotos: c.fotos || [] }));
  const payload = { nombre, precio, categoria, descripcion, fotos: fotosEditando, colores: coloresLimpios };
  let error;
  if (productoEditando){
    ({ error } = await sb.from("ropa_productos").update(payload).eq("id", productoEditando.id));
  } else {
    ({ error } = await sb.from("ropa_productos").insert(payload));
  }
  if (error){
    $("editarMsg").textContent = "Error guardando: " + error.message;
    $("editarMsg").className = "msg err";
    return;
  }
  $("editarMsg").textContent = "Guardado.";
  $("editarMsg").className = "msg ok";
  await cargarProductos();
  setTimeout(()=>{ close("overlayEditar"); }, 400);
});

$("btnBorrarProducto").addEventListener("click", async ()=>{
  if (!productoEditando) return;
  if (!confirm(`¿Borrar "${productoEditando.nombre}"? No se puede deshacer.`)) return;
  const { error } = await sb.from("ropa_productos").delete().eq("id", productoEditando.id);
  if (error){
    $("editarMsg").textContent = "Error borrando: " + error.message;
    $("editarMsg").className = "msg err";
    return;
  }
  await cargarProductos();
  close("overlayEditar");
});

// ---------- Panel general ----------
$("btnSubirLogo").addEventListener("click", ()=>{
  $("cLogoFotoInput").click();
});

$("cLogoFotoInput").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  const blob = await abrirRecortador(file);
  e.target.value = "";
  if (!blob) return;
  $("logoUploadMsg").textContent = "Subiendo logo...";
  $("logoUploadMsg").className = "msg";
  const path = `logo_${Date.now()}.jpg`;
  const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" });
  if (upErr){
    $("logoUploadMsg").textContent = "Error subiendo el logo: " + upErr.message;
    $("logoUploadMsg").className = "msg err";
    return;
  }
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  $("cLogoUrl").value = data.publicUrl;
  $("headerLogo").src = data.publicUrl;
  $("logoUploadMsg").textContent = "Listo, ahora tocá \"Guardar ajustes\" para dejarlo fijo.";
  $("logoUploadMsg").className = "msg ok";
});

$("btnGuardarConfig").addEventListener("click", async ()=>{
  const payload = {
    nombre_tienda: $("cNombreTienda").value.trim() || "Tienda de Ropa",
    logo_url: $("cLogoUrl").value.trim(),
    logo_size: Number($("cLogoSize").value) || 70,
    color_principal: colorPrincipalSeleccionado
  };
  const { error } = await sb.from("ropa_config").update(payload).eq("id",1);
  if (error){
    $("configMsg").textContent = "Error: " + error.message;
    $("configMsg").className = "msg err";
    return;
  }
  $("configMsg").textContent = "Ajustes guardados.";
  $("configMsg").className = "msg ok";
  await cargarConfig();
});

$("btnCambiarPinPanel").addEventListener("click", async ()=>{
  const actual = $("pinPanelActual").value.trim();
  const nuevo = $("pinPanelNuevo").value.trim();
  if (actual !== config.pin_panel){
    $("pinPanelMsg").textContent = "El PIN actual no coincide.";
    $("pinPanelMsg").className = "msg err";
    return;
  }
  if (!nuevo){
    $("pinPanelMsg").textContent = "Poné el PIN nuevo.";
    $("pinPanelMsg").className = "msg err";
    return;
  }
  const { error } = await sb.from("ropa_config").update({ pin_panel: nuevo }).eq("id",1);
  if (error){
    $("pinPanelMsg").textContent = "Error: " + error.message;
    $("pinPanelMsg").className = "msg err";
    return;
  }
  config.pin_panel = nuevo;
  $("pinPanelActual").value = ""; $("pinPanelNuevo").value = "";
  $("pinPanelMsg").textContent = "PIN del Panel actualizado.";
  $("pinPanelMsg").className = "msg ok";
});

$("btnNuevoProducto").addEventListener("click", ()=> abrirEditor(null));

function renderListaProductosAdmin(){
  const cont = $("listaProductosAdmin");
  if (!productos.length){
    cont.innerHTML = `<p style="color:var(--muted);">No hay productos todavía.</p>`;
    return;
  }
  cont.innerHTML = productos.map(p=>`
    <div class="prod-admin-row" data-id="${p.id}">
      <img src="${primeraFoto(p)}">
      <div class="info"><b>${p.nombre}</b><br><span style="color:var(--muted);font-size:0.9em;">${p.categoria} · ${money(p.precio)}</span></div>
      <button class="icon-btn" data-edit="${p.id}">Editar</button>
    </div>
  `).join("");
  cont.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const prod = productos.find(p=>p.id === btn.dataset.edit);
      if (prod) abrirEditor(prod);
    });
  });
}

// ---------- Init ----------
(async function init(){
  await cargarConfig();
  await cargarProductos();
})();
</script>
